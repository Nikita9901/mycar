name: mycar
description: "MyCar — бортовой журнал и учёт расходов для автомобиля."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- State Management ---
  flutter_bloc: ^9.1.1         # BLoC / Cubit для управления состоянием
  equatable: ^2.0.7            # Сравнение объектов без boilerplate

  # --- Локальная база данных (Drift / Moor) ---
  drift: ^2.23.1               # Типизированный SQL ORM для Flutter
  sqlite3_flutter_libs: ^0.5.0 # Нативные бинарники SQLite для iOS/Android
  path_provider: ^2.1.5        # Получение пути к директории документов
  path: ^1.9.1                 # Утилиты для работы с путями файловой системы

  # --- DI (Dependency Injection) ---
  get_it: ^8.0.3               # Service Locator для внедрения зависимостей

  # --- Графики ---
  fl_chart: ^0.71.0            # Графики и диаграммы (аналитика расходов)

  # --- Типографика ---
  google_fonts: ^6.2.1           # Manrope — современный геометрический шрифт

  # --- Файлы ---
  file_picker: ^8.1.7          # Выбор файлов (PDF страховки) с устройства
  open_filex: ^4.3.4           # Открытие файлов через ОС (просмотр PDF)
  pdf: ^3.11.1                 # Генерация PDF-документов
  share_plus: ^10.1.4          # Системный диалог «Поделиться» (PDF-отчёт)

  # --- Настройки ---
  shared_preferences: ^2.3.4   # Хранение настроек (валюта, уведомления)
  package_info_plus: ^8.1.3    # Версия приложения (для экрана настроек)

  # --- GPS / Разрешения / Уведомления ---
  geolocator: ^13.0.1                    # GPS-координаты и стриминг местоположения
  permission_handler: ^11.3.1            # Запрос разрешений (location, bluetooth)
  flutter_local_notifications: ^18.0.1   # Уведомления с кнопками действий

  # --- Утилиты ---
  intl: ^0.20.2                # Форматирование дат и чисел (локаль ru)
  uuid: ^4.5.1                 # Генерация уникальных идентификаторов
  flutter_localizations:       # Локализация Material-виджетов (ru_RU)
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # --- Кодогенерация для Drift ---
  drift_dev: ^2.23.1           # Генератор кода для таблиц и запросов Drift
  build_runner: ^2.4.15        # Запуск кодогенерации (dart run build_runner build)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0D1A"
  adaptive_icon_foreground: "assets/icon.png"
  web:
    generate: false


flutter_launcher_icons_round:
  android: "ic_launcher_round"
  ios: false
  image_path: "assets/round-icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
